<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>그린 식탁</title>
  <meta name="description" content="색연필로 그린 디저트와 음식, 그걸 먹던 순간을 모은 그림 식탁. 이채은의 웹 아카이브.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="그린 식탁">
  <meta property="og:description" content="색연필로 그린 디저트와 음식, 그걸 먹던 순간을 모은 그림 식탁">
  <meta property="og:image" content="https://chaeeun05524-lgtm.github.io/green-table/og.jpg">
  <meta property="og:url" content="https://chaeeun05524-lgtm.github.io/green-table/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 공통 머리말 -->
  <header class="site-header">
    <a href="index.html" class="logo">그린 식탁</a>
    <span class="subtitle">색연필로 기록한 맛의 순간</span>
    <nav class="menu">
      <a href="category.html">분류</a>
      <a href="about.html">소개</a>
    </nav>
  </header>

  <!-- 식탁: 디저트와 연결선은 js/home.js가 채움 -->
  <!-- 화면 전체: 가운데 식탁 + 그 주변 종이 위에 흩어진 그림들 -->
  <main class="scene">
    <div class="table">
      <!-- 회전하는 식탁보: 식탁 위 그림과 연결선이 이 안에 올라감 -->
      <div class="spin">
        <div class="stains"></div>   <!-- 커피 자국, 소스 얼룩, 빵 부스러기 -->
        <svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
      </div>
    </div>
  </main>

  <!-- 하단 색인 -->
  <section class="colophon">
    <div class="colophon-title">
      <h1>그린 식탁</h1>
      <p class="tag">GREEN TABLE | NO. 001</p>
      <p class="tag mute">색연필 · 종이 · 기억</p>
      <p class="lead">직접 먹고 그린 음식들,<br>내가 만난 곳과 순간을 따라 모음.<br>전체 목록은 영수증으로 →</p>
    </div>

    <!-- 전체 색인: 영수증 (내용은 js/home.js가 채움) -->
    <div class="receipt-wrap">
      <div class="receipt" id="receipt"></div>
      <div class="stamp" id="stamp"></div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/home.js"></script>
  <script src="js/drag.js"></script>
</body>
</html>
